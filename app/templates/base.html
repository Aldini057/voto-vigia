<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}VotoVigía | INE{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex font-sans overflow-hidden">

  <!-- SIDEBAR COMÚN -->
  <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4 shrink-0">
    <div>
      <div class="flex items-center gap-3 px-2 py-3 mb-6">
        <span class="text-2xl">🗳️</span>
        <div>
          <h1 class="text-base font-bold text-white leading-tight">VotoVigía</h1>
          <span class="text-[10px] text-rose-400 font-medium tracking-wide">INE HACKATHON 2026</span>
        </div>
      </div>

      <nav class="space-y-1.5">
        <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition {{ 'bg-rose-600/20 text-white border border-rose-500/30' if active_page == 'semaforo' else 'text-slate-400 hover:text-white hover:bg-slate-800/60' }}">
          <span>🗺️</span> Semáforo Territorial
        </a>
        <a href="/simulador" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition {{ 'bg-rose-600/20 text-white border border-rose-500/30' if active_page == 'simulador' else 'text-slate-400 hover:text-white hover:bg-slate-800/60' }}">
          <span>⚙️</span> Simulador What-If
        </a>
        <a href="/metricas" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium transition {{ 'bg-rose-600/20 text-white border border-rose-500/30' if active_page == 'metricas' else 'text-slate-400 hover:text-white hover:bg-slate-800/60' }}">
          <span>📊</span> Factores y Métricas
        </a>
      </nav>
    </div>

    <div class="border-t border-slate-800 pt-4 space-y-2">
      <a href="/docs" target="_blank" class="flex items-center justify-between text-xs text-slate-400 hover:text-white px-2 py-1.5 rounded-lg hover:bg-slate-800 transition">
        <span class="flex items-center gap-2"><span>📖</span> Swagger API</span>
        <span class="text-[10px] bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">OpenAPI</span>
      </a>
      <div class="flex items-center gap-2 px-2 py-1">
        <div class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="text-[11px] text-emerald-400 font-medium">CatBoost Online</span>
      </div>
    </div>
  </aside>

  <!-- CONTENIDO DE CADA PÁGINA -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto p-8 space-y-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
